query Team($number: Int!, $season: Int!) {
    teamByNumber(number: $number) {
        name
        number
        website
        name
        location {
            city
            state
            country
        }
        schoolName
        sponsors
        rookieYear
        activeSeasons
        quickStats(season: $season) {
            tot {
                value
                rank
            }
            auto {
                value
                rank
            }
            dc {
                value
                rank
            }
            eg {
                value
                rank
            }
            count
        }
        epa(season: $season) {
            epa
            matchesPlayed
            rank
        }
        epaHistory(season: $season) {
            matchId
            eventCode
            epa
            matchesPlayed
            matchTime
        }
        epaGroup(season: $season) {
            auto {
                epa
                matchesPlayed
                rank
            }
            dc {
                epa
                matchesPlayed
                rank
            }
            eg {
                epa
                matchesPlayed
                rank
            }
        }
        epaGroupHistory(season: $season) {
            auto {
                matchId
                eventCode
                epa
                matchesPlayed
                matchTime
            }
            dc {
                matchId
                eventCode
                epa
                matchesPlayed
                matchTime
            }
            eg {
                matchId
                eventCode
                epa
                matchesPlayed
                matchTime
            }
        }
        events(season: $season) {
            season
            eventCode
            teamNumber
            stats {
                __typename
                ...TeamPageStats
            }
            awards {
                season
                eventCode
                teamNumber
                type
                placement
                personName
            }
            event {
                ...BasicEventInfo
                teams {
                    season
                    eventCode
                    teamNumber
                }
            }
            matches {
                season
                eventCode
                matchId
                station
                alliance
                match {
                    ...FullMatch
                }
            }
        }
    }
}
