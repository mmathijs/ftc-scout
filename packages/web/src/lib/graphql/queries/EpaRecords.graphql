query EpaRecords($season: Int!, $sortDir: SortDir, $skip: Int!, $take: Int!) {
    epaRecords(season: $season, sortDir: $sortDir, skip: $skip, take: $take) {
        count
        offset
        data {
            epa
            matchesPlayed
            rank
            team {
                number
                name
            }
        }
    }
}
