services:
    db:
        image: postgres:18
        container_name: ftcscout-db
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 20

    server:
        build:
            context: .
            dockerfile: packages/server/Dockerfile
            args:
                NODE_VERSION: "20.20.0"
        container_name: ftcscout-server
        network_mode: host
        env_file:
            - packages/server/.env
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        cpu_shares: 1536
        mem_reservation: 384M
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 1G

    web:
        build:
            context: .
            dockerfile: packages/web/Dockerfile
            network: host
            args:
                NODE_VERSION: "20.20.0"
                CODEGEN_ENV: docker
        container_name: ftcscout-web
        network_mode: host
        env_file:
            - packages/web/.env
        restart: unless-stopped
        depends_on:
            - server
        cpu_shares: 1024
        mem_reservation: 192M
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 512M

volumes:
    pgdata:
